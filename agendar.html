<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NailControl - Agendar Horário</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    :root{--primary:#e91e90;--secondary:#7c3aed;--success:#10b981;--bg:#faf5f9;--card:#fff;--text:#1e1b2e;--text-muted:#6b7280;--border:#f0e4ec}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
    .container{max-width:500px;margin:0 auto}
    .header{text-align:center;margin-bottom:24px}
    .header h1{font-size:26px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .header p{color:var(--text-muted);font-size:13px;margin-top:4px}
    .card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:20px;margin-bottom:16px;box-shadow:0 2px 16px rgba(233,30,144,0.06)}
    .card h2{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--text)}
    .form-group{margin-bottom:14px}
    .form-label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px}
    .form-input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;background:var(--bg);transition:border-color 0.2s}
    .form-input:focus{outline:none;border-color:var(--primary)}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
    .calendar-header{font-size:10px;font-weight:600;color:var(--text-muted);text-align:center;padding:6px 0}
    .calendar-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;border:2px solid transparent;background:var(--bg)}
    .calendar-day:hover:not(.disabled):not(.empty){border-color:var(--primary)}
    .calendar-day.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
    .calendar-day.disabled{opacity:0.3;cursor:not-allowed}
    .calendar-day.today{border-color:var(--primary)}
    .calendar-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .calendar-nav button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text);padding:4px 8px}
    .calendar-nav span{font-weight:700;font-size:14px}
    .horarios{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .horario-btn{padding:9px;border:2px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;text-align:center;font-family:inherit;font-size:12px;font-weight:600;transition:all 0.2s}
    .horario-btn:hover:not(.disabled){border-color:var(--primary)}
    .horario-btn.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
    .horario-btn.disabled{opacity:0.3;cursor:not-allowed;text-decoration:line-through}
    .btn-agendar{width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;margin-top:4px}
    .btn-agendar:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(233,30,144,0.3)}
    .success-message{text-align:center;padding:30px 16px}
    .success-message .icon{font-size:50px;margin-bottom:12px}
    .success-message h2{font-size:20px;font-weight:700;margin-bottom:6px;justify-content:center}
    .success-message p{color:var(--text-muted);font-size:13px;margin-bottom:16px}
    .btn-novo{padding:10px 20px;border:2px solid var(--primary);border-radius:8px;background:transparent;color:var(--primary);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .aviso{background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:16px}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>NailControl</h1>
      <p>Agende sua coleta</p>
    </div>

    <div id="form-agendamento">
      <div class="aviso">Coleta das 13:00 às 18:00. Apenas 1 agendamento por telefone por dia.</div>

      <div class="card">
        <h2>📅 Escolha o Dia</h2>
        <div class="calendar-nav">
          <button onclick="mudarMes(-1)">◀</button>
          <span id="mes-ano"></span>
          <button onclick="mudarMes(1)">▶</button>
        </div>
        <div class="calendar" id="calendar"></div>
      </div>

      <div class="card" id="card-horarios" style="display:none;">
        <h2>🕐 Horários Disponíveis</h2>
        <div class="horarios" id="horarios"></div>
      </div>

      <div class="card" id="card-dados" style="display:none;">
        <h2>📝 Seus Dados</h2>
        <div class="form-group">
          <label class="form-label">Nome *</label>
          <input type="text" class="form-input" id="input-nome" placeholder="Seu nome">
        </div>
        <div class="form-group">
          <label class="form-label">Telefone *</label>
          <input type="text" class="form-input" id="input-telefone" placeholder="(00) 00000-0000">
        </div>
        <div class="form-group">
          <label class="form-label">Endereço</label>
          <input type="text" class="form-input" id="input-endereco" placeholder="Rua, número, bairro...">
        </div>
        <div class="form-group">
          <label class="form-label">O que vai gravar?</label>
          <input type="text" class="form-input" id="input-item" placeholder="Ex: Alicate rosa, adorned...">
        </div>
        <div class="form-group">
          <label class="form-label">Quantidade</label>
          <input type="number" class="form-input" id="input-quantidade" min="1" value="1">
        </div>
        <button class="btn-agendar" onclick="agendar()">Agendar Horário</button>
      </div>
    </div>
  </div>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBBERqs003HKOlIX_q5h7O7DywO7jwlGhI",
      authDomain: "nailcontrol-21607.firebaseapp.com",
      databaseURL: "https://nailcontrol-21607-default-rtdb.firebaseio.com",
      projectId: "nailcontrol-21607",
      storageBucket: "nailcontrol-21607.firebasestorage.app",
      messagingSenderId: "493642925848",
      appId: "1:493642925848:web:2ed04dd98fad3edebe806d"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    var mesAtual = new Date().getMonth();
    var anoAtual = new Date().getFullYear();
    var dataSelecionada = null;
    var horarioSelecionado = null;

    var horariosBusca = ['13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30'];

    function renderizarCalendario() {
      var meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
      document.getElementById('mes-ano').textContent = meses[mesAtual] + ' ' + anoAtual;

      var primeiroDia = new Date(anoAtual, mesAtual, 1).getDay();
      var diasNoMes = new Date(anoAtual, mesAtual + 1, 0).getDate();
      var hoje = new Date();
      hoje.setHours(0,0,0,0);

      var diasSemana = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
      var html = '';
      for (var d = 0; d < 7; d++) {
        html += '<div class="calendar-header">' + diasSemana[d] + '</div>';
      }

      for (var i = 0; i < primeiroDia; i++) {
        html += '<div class="calendar-day empty"></div>';
      }

      for (var dia = 1; dia <= diasNoMes; dia++) {
        var data = new Date(anoAtual, mesAtual, dia);
        data.setHours(0,0,0,0);
        var dataStr = anoAtual + '-' + String(mesAtual + 1).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
        var isHoje = data.getTime() === hoje.getTime();
        var isPassado = data < hoje;
        var isDomingo = data.getDay() === 0;

        var classes = 'calendar-day';
        if (isHoje) classes += ' today';
        if (isPassado || isDomingo) classes += ' disabled';
        if (dataSelecionada === dataStr) classes += ' selected';

        var onclick = (isPassado || isDomingo) ? '' : "onclick=\"selecionarData('" + dataStr + "')\"";
        html += '<div class="' + classes + '" ' + onclick + '>' + dia + '</div>';
      }

      document.getElementById('calendar').innerHTML = html;
    }

    function mudarMes(delta) {
      mesAtual += delta;
      if (mesAtual > 11) { mesAtual = 0; anoAtual++; }
      if (mesAtual < 0) { mesAtual = 11; anoAtual--; }
      renderizarCalendario();
    }

    function selecionarData(data) {
      dataSelecionada = data;
      horarioSelecionado = null;
      renderizarCalendario();
      carregarHorarios();
    }

    function carregarHorarios() {
      document.getElementById('card-horarios').style.display = 'block';
      document.getElementById('card-dados').style.display = 'none';

      var html = '';
      for (var i = 0; i < horariosBusca.length; i++) {
        var h = horariosBusca[i];
        var cls = 'horario-btn';
        var onclick = "onclick=\"selecionarHorario('" + h + "', this)\"";
        html += '<button class="' + cls + '" ' + onclick + '>' + h + '</button>';
      }
      document.getElementById('horarios').innerHTML = html;

      db.ref('nailcontrol/agendamentos').once('value').then(function(snapshot) {
        var ocupados = [];
        var val = snapshot.val();
        if (val) {
          var keys = Object.keys(val);
          for (var i = 0; i < keys.length; i++) {
            var a = val[keys[i]];
            if (a && a.data === dataSelecionada && a.status !== 'cancelado' && a.hora) {
              ocupados.push(a.hora);
            }
          }
        }
        var botoes = document.querySelectorAll('.horario-btn');
        for (var j = 0; j < botoes.length; j++) {
          var horarioTexto = botoes[j].textContent;
          if (ocupados.indexOf(horarioTexto) !== -1) {
            botoes[j].classList.add('disabled');
            botoes[j].removeAttribute('onclick');
          }
        }
      }).catch(function() {});
    }

    function selecionarHorario(hora, btn) {
      horarioSelecionado = hora;
      var botoes = document.querySelectorAll('.horario-btn');
      for (var i = 0; i < botoes.length; i++) botoes[i].classList.remove('selected');
      btn.classList.add('selected');
      document.getElementById('card-dados').style.display = 'block';
    }

    function agendar() {
      var nome = document.getElementById('input-nome').value.trim();
      var telefone = document.getElementById('input-telefone').value.trim();
      var endereco = document.getElementById('input-endereco').value.trim();
      var item = document.getElementById('input-item').value.trim();
      var quantidade = document.getElementById('input-quantidade').value;

      if (!nome || !telefone) {
        alert('Preencha nome e telefone!');
        return;
      }

      var telefoneLimpo = telefone.replace(/\D/g, '');

      db.ref('nailcontrol/agendamentos').once('value').then(function(snapshot) {
        var val = snapshot.val();
        if (val) {
          var hoje = new Date();
          hoje.setHours(0,0,0,0);
          var keys = Object.keys(val);
          for (var i = 0; i < keys.length; i++) {
            var a = val[keys[i]];
            if (a && a.telefone) {
              var telCadastro = a.telefone.replace(/\D/g, '');
              if (telCadastro === telefoneLimpo && a.data === dataSelecionada && a.status !== 'cancelado') {
                alert('Voce ja tem um agendamento neste dia! So e permitido 1 agendamento por dia por telefone.');
                return;
              }
            }
          }
        }

        var novoAgendamento = {
          id: Date.now().toString(),
          clienteId: 'publico_' + Date.now(),
          nome: nome,
          telefone: telefone,
          endereco: endereco,
          tipo: 'busca',
          status: 'pendente',
          data: dataSelecionada,
          hora: horarioSelecionado,
          item: item || 'Alicate',
          quantidade: parseInt(quantidade) || 1,
          valor: 0,
          obs: '',
          criadoEm: new Date().toISOString()
        };

        return db.ref('nailcontrol/agendamentos/' + novoAgendamento.id).set(novoAgendamento);
      }).then(function(result) {
        if (!result) return;

        var dataFormatada = formatarData(dataSelecionada);

        var msg = encodeURIComponent(
          'Novo pre-agendamento confirmado!\n\n' +
          'Coleta\n' +
          'Data: ' + dataFormatada + '\n' +
          'Horario: ' + horarioSelecionado + '\n\n' +
          'Cliente: ' + nome + '\n' +
          'Telefone: ' + telefone + '\n' +
          'Endereco: ' + (endereco || 'Nao informado') + '\n' +
          'Item: ' + (item || 'Alicate') + '\n' +
          'Quantidade: ' + (quantidade || 1)
        );

        document.getElementById('form-agendamento').innerHTML =
          '<div class="card"><div class="success-message">' +
            '<div class="icon">✅</div>' +
            '<h2>Agendamento Confirmado!</h2>' +
            '<p>Coleta agendada para ' + dataFormatada + ' as ' + horarioSelecionado + '</p>' +
            '<br><button class="btn-novo" onclick="location.reload()">Agendar Novo Horario</button>' +
          '</div></div>';

        window.open('https://api.whatsapp.com/send?phone=5531989390637&text=' + msg, '_blank');
      }).catch(function(error) {
        alert('Erro ao agendar. Tente novamente.');
        console.error(error);
      });
    }

    function formatarData(data) {
      var parts = data.split('-');
      return parts[2] + '/' + parts[1] + '/' + parts[0];
    }

    renderizarCalendario();
  </script>
</body>
</html>
